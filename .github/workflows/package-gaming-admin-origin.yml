name: Package Gaming Admin CMS Companion

on:
  push:
    branches:
      - feature/gaming-admin-origin

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          zip -qr next-f-cms-gaming-admin-origin.zip . -x ".git/*" "node_modules/*" "dist/*" "*.tsbuildinfo"
      - uses: actions/upload-artifact@v4
        with:
          name: next-f-cms-gaming-admin-origin
          path: next-f-cms-gaming-admin-origin.zip
          if-no-files-found: error
          retention-days: 7
