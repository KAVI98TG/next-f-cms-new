<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/next-f-app-icon.png" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("nextf.cms.theme");
          const mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          const theme = mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {}
      })();
    </script>
    <title>NEXT F CMS</title>
    <meta name="description" content="NEXT F unified business operations CMS." />
    <meta name="robots" content="noindex,nofollow,noarchive" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
